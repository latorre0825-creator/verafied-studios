<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f04e12"/>
      <stop offset="50%" stop-color="#ff6b2c"/>
      <stop offset="100%" stop-color="#ffd9c7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#05060a"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#fire)" stroke-width="12" opacity="0.9"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.5"/>
  <!-- Stylized chameleon / flame body -->
  <path d="M256 120
           C220 160, 180 200, 190 260
           C200 320, 240 360, 256 400
           C272 360, 312 320, 322 260
           C332 200, 292 160, 256 120Z" fill="url(#fire)"/>
  <!-- Eye -->
  <circle cx="256" cy="230" r="22" fill="#05060a"/>
  <circle cx="262" cy="224" r="8" fill="#ffd9c7"/>
  <!-- Flame tips -->
  <path d="M256 100 L270 150 L256 140 L242 150 Z" fill="#ffd9c7"/>
  <path d="M180 200 L210 230 L190 220 L175 240 Z" fill="#ff6b2c" opacity="0.8"/>
  <path d="M332 200 L302 230 L322 220 L337 240 Z" fill="#ff6b2c" opacity="0.8"/>
  <!-- Bottom curl (tail) -->
  <path d="M256 380
           C280 400, 300 420, 280 450
           C260 480, 230 460, 240 430
           C250 400, 240 390, 256 380Z" fill="url(#accent)" opacity="0.7"/>
  <!-- Text ring -->
  <text x="256" y="490" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ff6b2c" letter-spacing="4">VERAFIED</text>
</svg>
